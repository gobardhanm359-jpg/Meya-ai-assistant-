  <body>
    <div id="root"></div>
    <script>
      (function () {
        if ('caches' in window) {
          caches.keys().then(function (keys) {
            keys.forEach(function (key) {
              if (key.indexOf('v6') === -1) {
                caches.delete(key);
              }
            });
          }).catch(function () {});
        }
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (reg) {
              reg.update().catch(function () {});
            });
          }).catch(function () {});
        }
      })();
    </script>
